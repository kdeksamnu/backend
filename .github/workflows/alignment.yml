name: Manifold Alignment Ritual

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Align Repository Topics and Description
        id: align-metadata
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`Aligning metadata for ${owner}/${repo}...`);
            
            try {
              const response = await github.rest.repos.update({
                owner,
                repo,
                description: "MLAOS-Prime Cathedral-Engine Paraconsistent Logic Kernel",
                topics: ["godot", "python", "fastapi", "paraconsistent-logic", "mlaos"]
              });
              
              console.log(`Metadata alignment completed successfully with status: ${response.status}`);
            } catch (error) {
              console.error("❌ Failed to update repository metadata via GitHub API:");
              console.error(`- Status Code: ${error.status || 'Unknown'}`);
              console.error(`- Message: ${error.message}`);
              
              if (error.response && error.response.data) {
                console.error("- API Error Details:", JSON.stringify(error.response.data, null, 2));
              }
              
              throw error;
            }
